remote_theme: mmistakes/minimal-mistakes

# Site Settings
locale: "en-US"
title: "Chendong Xin"
title_separator: "-"
subtitle: "Robot Learning and Manipulation"
name: "Chendong Xin"
description: >-
  Ph.D. student in Robotics at Georgia Tech
url: "https://star-xcd.github.io"
baseurl: ""
repository: "Star-Xcd/star-xcd.github.io"

# Site Configuration
timezone: Asia/Shanghai
minimal_mistakes_skin: mint
search: true
breadcrumbs: false
words_per_minute: 200
  
# Site Author
author:
  name: "Chendong Xin"
  avatar: "assets/images/bio-photo.jpg"
  bio: "Ph.D. student in Robotics at Georgia Tech"
  location: "Atlanta, GA"
  email: "cxin34@gatech.edu"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Star-Xcd"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=XFT4DAsAAAAJ"
    # - label: "Instagram"
    #   icon: "fab fa-fw fa-instagram"
